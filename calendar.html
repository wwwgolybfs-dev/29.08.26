<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Petzker — Календарь выходных</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/500.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/600.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/700.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/manrope@5/800.css" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============ PETZKER · Calendar iframe (minimal Apple/Win11 patch) ============ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --gold-grad:linear-gradient(135deg,#eef0f3 0%,#d8dce2 48%,#c3c8d1 100%);
  --r-lg:20px;--r-md:16px;--r-sm:12px;
  --font:'Manrope',-apple-system,'SF Pro Text',system-ui,sans-serif;
}
html[data-theme="light"]{
  --bg:#f5f5f7;--text:#1d1d1f;--muted:#6e6e73;
  --stroke:rgba(0,0,0,.07);--stroke-strong:rgba(0,0,0,.14);
  --surface:rgba(255,255,255,.72);--surface-2:rgba(255,255,255,.55);
  --hi:rgba(255,255,255,.9);--shadow:0 10px 28px rgba(0,0,0,.06);
  --gold:#0a84ff;--gold-soft:rgba(10,132,255,.10);--gold-border:rgba(10,132,255,.28);
  --sheet-bg:rgba(255,255,255,.92);
  --danger:#ff3b30;--ok:#34c759;
  --day-free-border:rgba(52,199,89,.45);--day-free-bg:rgba(52,199,89,.08);
  --day-one-border:rgba(10,132,255,.45);--day-one-bg:rgba(10,132,255,.08);
  --day-full-border:rgba(255,59,48,.45);--day-full-bg:rgba(255,59,48,.08);
}
html[data-theme="dark"]{
  --bg:#000000;--text:#f5f5f7;--muted:#98989d;
  --stroke:rgba(255,255,255,.08);--stroke-strong:rgba(255,255,255,.16);
  --surface:rgba(28,28,30,.72);--surface-2:rgba(28,28,30,.5);
  --hi:rgba(255,255,255,.06);--shadow:0 10px 28px rgba(0,0,0,.5);
  --gold:#0a84ff;--gold-soft:rgba(10,132,255,.14);--gold-border:rgba(10,132,255,.35);
  --sheet-bg:rgba(22,22,24,.92);
  --danger:#ff453a;--ok:#30d158;
  --day-free-border:rgba(48,209,88,.5);--day-free-bg:rgba(48,209,88,.1);
  --day-one-border:rgba(10,132,255,.5);--day-one-bg:rgba(10,132,255,.12);
  --day-full-border:rgba(255,69,58,.5);--day-full-bg:rgba(255,69,58,.12);
}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:15px;line-height:1.45;overflow-x:hidden;transition:background .4s,color .4s}
button{font-family:var(--font);color:inherit;touch-action:manipulation}
::-webkit-scrollbar{width:0;height:0}

.glass{background:var(--surface);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--stroke);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);border-radius:var(--r-lg)}

/* buttons */
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:15px;cursor:pointer;transition:transform .15s,box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn-gold{background:var(--gold);color:#fff;box-shadow:0 4px 14px rgba(10,132,255,.28)}
.btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--stroke)}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn[disabled]{opacity:.45;pointer-events:none}
.mini-link{border:0;background:none;color:var(--gold);font-weight:700;font-size:12.5px;cursor:pointer;padding:4px 6px}

.icon-btn{width:40px;height:40px;flex:none;border-radius:14px;border:1px solid var(--stroke);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;transition:transform .15s;font-size:18px;color:var(--text)}
.icon-btn:active{transform:scale(.92)}

/* calendar */
.cal-card{padding:12px 8px 10px;overflow:hidden;width:100%;box-sizing:border-box}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.cal-title{display:flex;flex-direction:column;align-items:center;gap:2px}
.cal-title b{font-size:17px;font-weight:800}
.cal-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;margin-bottom:6px}
.cal-week span{text-align:center;font-size:11px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.cal-week span.we{color:var(--gold)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;width:100%}
.cal-cell{position:relative;height:54px;min-width:0;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border:1.5px solid transparent;transition:transform .12s,background .2s,border-color .2s;padding:2px 1px;background:var(--surface-2);box-sizing:border-box;overflow:hidden}
.cal-cell:active{transform:scale(.9)}
.cal-cell .n{font-weight:700;font-size:12.5px;line-height:1}
.cal-cell.out{opacity:.28;pointer-events:none;background:transparent;border-color:transparent}
.cal-cell.s0{border-color:var(--day-free-border);background:var(--day-free-bg)}
.cal-cell.s1{border-color:var(--day-one-border);background:var(--day-one-bg)}
.cal-cell.s2{border-color:var(--day-full-border);background:var(--day-full-bg)}
.cal-cell.today{box-shadow:inset 0 0 0 1.5px var(--gold-border)}
.cal-cell.today .n{color:var(--gold)}
.cal-cell.s2 .n{color:var(--danger)}
.cal-cell .mavs{display:flex;align-items:center;justify-content:center;height:20px;width:100%;max-width:100%;overflow:hidden}
.cal-cell .mavs .av{width:18px!important;height:18px!important;font-size:18px!important;margin-left:-4px;border:1.5px solid var(--bg);box-shadow:none;flex:none}
.cal-cell .mavs .av:first-child{margin-left:0}
.cal-cell .mavs .av-i{font-size:.5em}
.cal-cell .mavs .av-p{border-radius:50%}
.cal-cell.flash{animation:flash 1.4s ease}
@keyframes flash{0%,100%{background:transparent}30%{background:var(--gold-soft);border-color:var(--gold-border);box-shadow:0 0 0 4px var(--gold-soft)}}
.cal-legend{display:flex;flex-wrap:wrap;gap:10px 14px;justify-content:center;margin-top:12px;font-size:11px;color:var(--muted);font-weight:600}
.lg-dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;border:1.5px solid transparent;box-sizing:border-box}
.lg-free{border-color:var(--day-free-border);background:var(--day-free-bg)}
.lg-one{border-color:var(--day-one-border);background:var(--day-one-bg)}
.lg-full{border-color:var(--day-full-border);background:var(--day-full-bg)}
.lg-ring{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--gold-border);margin-right:5px;vertical-align:middle;box-shadow:0 0 0 1px var(--gold-border)}
.row-label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:18px 4px 8px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-day{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold-border);background:var(--gold-soft);color:var(--gold);border-radius:12px;padding:8px 12px;font-weight:800;font-size:12.5px;cursor:pointer;transition:transform .15s}
.chip-day:active{transform:scale(.94)}
.block-head{display:flex;align-items:baseline;justify-content:space-between;margin:20px 4px 10px}
.block-head b{font-size:16px;font-weight:800}
.up-list{display:flex;flex-direction:column;gap:10px}
.up-row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:20px;cursor:pointer;transition:transform .15s}
.up-row:active{transform:scale(.98)}
.up-date{width:46px;flex:none;text-align:center;border-radius:14px;background:var(--surface-2);border:1px solid var(--stroke);padding:6px 0}
.up-date b{display:block;font-size:17px;font-weight:800;line-height:1.1}
.up-date span{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.up-mid{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.up-names{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat-chip{flex:none;font-size:12px;font-weight:800;border-radius:10px;padding:5px 9px;background:var(--surface-2);border:1px solid var(--stroke);color:var(--muted)}
.seat-chip.full{color:var(--gold);border-color:var(--gold-border);background:var(--gold-soft)}
.empty{padding:26px 16px;text-align:center;color:var(--muted);font-weight:600;font-size:14px}
.empty .big{font-size:34px;display:block;margin-bottom:8px}

/* avatars */
.av-wrap{display:inline-flex;flex-direction:column;align-items:center;flex:none;line-height:0}
.av{position:relative;flex:none;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);overflow:hidden}
.av-i{font-weight:800;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.25);font-size:.42em;line-height:1}
.av-p{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%}
.avstack{display:flex;align-items:flex-end}
.avstack .av-wrap{margin-left:-8px}
.avstack .av-wrap:first-child{margin-left:0}
.avstack .av{border:2px solid var(--bg)}

/* day sheet */
#dayBd{z-index:65}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;background:var(--sheet-bg);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);border:1px solid var(--stroke);border-bottom:0;border-radius:26px 26px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));z-index:70;transform:translateY(105%);transition:transform .45s cubic-bezier(.32,.72,.25,1),opacity .3s;max-height:86dvh;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sheet-h{width:44px;height:5px;border-radius:3px;background:var(--stroke-strong);margin:6px auto 14px}
.sheet-date{display:flex;flex-direction:column;gap:2px;margin-bottom:14px}
.sheet-date b{font-size:19px;font-weight:800}
.sheet-date span{font-size:13px;color:var(--muted);font-weight:700}
.seats{display:flex;gap:10px;margin-bottom:14px}
.seat{flex:1;border-radius:18px;border:1px dashed var(--stroke-strong);padding:12px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:700}
.seat.taken{border-style:solid;border-color:var(--stroke);background:var(--surface-2);color:var(--text)}
.day-note{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:12px}
.sheet-actions{display:flex;gap:10px;margin-top:14px}
.sheet-actions .btn{flex:1}
@media (min-width:760px){
  .sheet{left:50%;top:50%;bottom:auto;right:auto;transform:translate(-50%,-50%) scale(.94);opacity:0;border-radius:26px;border-bottom:1px solid var(--stroke);width:min(470px,calc(100vw - 40px));max-height:min(720px,86dvh)}
  .sheet.on{transform:translate(-50%,-50%) scale(1);opacity:1}
  .cal-cell{height:58px}
}
@media (hover:hover){
  .cal-cell:not(.out):hover{background:var(--surface-2)}
  .up-row:hover{border-color:var(--gold-border)}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* toasts */
.toasts{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none}
.toast{background:var(--sheet-bg);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:1px solid var(--stroke);box-shadow:var(--shadow),inset 0 1px 0 var(--hi);padding:11px 18px;border-radius:16px;font-weight:800;font-size:13.5px;max-width:calc(100vw - 44px);transform:translateY(-18px);opacity:0;transition:.35s cubic-bezier(.25,.7,.3,1);display:flex;align-items:center;gap:8px}
.toast.in{transform:none;opacity:1}
.toast .tdot{width:8px;height:8px;flex:none;border-radius:50%}
.toast.ok .tdot{background:var(--gold)}
.toast.err .tdot{background:var(--danger)}
.toast.info .tdot{background:var(--muted)}

.sk{position:relative;overflow:hidden;background:var(--surface-2);border-radius:12px}
.sk::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--hi),transparent);animation:sh 1.2s infinite;transform:translateX(-100%)}
@keyframes sh{to{transform:translateX(100%)}}

/* ============================================================
   MOBILE PERFORMANCE MODE — тот же принцип, что в casino.html
   и в index.html: убираем дорогой backdrop-filter на телефонах.
   ============================================================ */
@media (max-width:700px){
  .glass,.sheet,.toast{
    backdrop-filter:none !important;
    -webkit-backdrop-filter:none !important;
    background:var(--sheet-bg) !important;
  }
  .bd{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;background:rgba(0,0,0,.5) !important}
  .cal-cell,.up-row,.chip-day{
    transition:transform .12s ease,border-color .12s ease !important;
  }
}
@media (max-width:700px) and (prefers-reduced-motion:reduce){
  .cal-cell.flash,.sk::after{animation-duration:.01ms !important;animation-iteration-count:1 !important}
}
</style>
</head>
<body>
<main class="app" style="position:relative;z-index:1;max-width:560px;margin:0 auto;padding:14px 8px calc(60px + env(safe-area-inset-bottom));width:100%;overflow-x:hidden">
  <section id="sc-calendar" class="screen active" style="display:block">
    <div class="cal-card glass">
      <div class="cal-head">
        <button class="icon-btn" id="calPrev" aria-label="Предыдущий месяц">‹</button>
        <div class="cal-title"><b id="calLabel">—</b><button class="mini-link" id="calToday">сегодня</button></div>
        <button class="icon-btn" id="calNext" aria-label="Следующий месяц">›</button>
      </div>
      <div class="cal-week"><span>Пн</span><span>Вт</span><span>Ср</span><span>Чт</span><span>Пт</span><span class="we">Сб</span><span class="we">Вс</span></div>
      <div class="cal-grid" id="calGrid"></div>
      <div class="cal-legend"><span><i class="lg-dot lg-free"></i>свободно</span><span><i class="lg-dot lg-one"></i>1 место</span><span><i class="lg-dot lg-full"></i>мест нет</span><span><i class="lg-ring"></i>сегодня</span></div>
    </div>
    <span class="row-label">Мои выходные</span>
    <div class="chips" id="myDays"></div>
    <div class="block-head"><b>Ближайшие</b><button class="mini-link" id="calSoon">показать в календаре</button></div>
    <div class="up-list" id="upList"></div>
  </section>
</main>

<!-- DAY SHEET -->
<div class="bd" id="dayBd" style="position:fixed;inset:0;background:rgba(8,8,10,.45);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .35s;z-index:65"></div>
<div class="sheet" id="daySheet">
  <div class="sheet-h"></div>
  <div class="sheet-date"><b id="dayTitle">—</b><span id="daySub"></span></div>
  <div class="seats" id="daySeats"></div>
  <div class="day-note" id="dayNote"></div>
  <div class="sheet-actions" id="dayActions"></div>
</div>

<div class="toasts" id="toastBox"></div>

<script>
'use strict';
/* ============ Calendar iframe — общается с родителем через postMessage ============ */

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const fmt = n => new Intl.NumberFormat('ru-RU').format(n);
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const MONTHS_GEN=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_MIN=['янв','февр','мар','апр','мая','июн','июл','авг','сент','окт','нояб','дек'];
const WD_FULL=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const iso = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromIso = s => { const p=s.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); };
const hash = s => { let h=0; for(const c of s) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); };
const escapeHTML = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

const tg = (window.Telegram && Telegram.WebApp) ? Telegram.WebApp : null;
try{ if(tg){ tg.ready(); } }catch(e){}
function haptic(t){ try{ if(tg&&tg.HapticFeedback){ if(t==='light') tg.HapticFeedback.impactOccurred('light'); else if(t==='success') tg.HapticFeedback.notificationOccurred('success'); else if(t==='error') tg.HapticFeedback.notificationOccurred('error'); } }catch(e){} }

/* ---- Локальное состояние (приходит от родителя через postMessage) ---- */
const store = { weekends: [], users: [], userId: null, maxSpots: 2 };
const state = { calY:new Date().getFullYear(), calM:new Date().getMonth(), selDate:null };

function getUser(id){ return store.users.find(u=>String(u.id)===String(id)) || null; }
function signupsFor(key){ return store.weekends.filter(w=>w.date===key); }

/* ---- Тема: читаем из localStorage (общий origin с родителем) ---- */
let themeMode = localStorage.getItem('petzker_theme') || 'system';
function systemDark(){ try{ if(tg&&tg.colorScheme) return tg.colorScheme==='dark'; }catch(e){} return window.matchMedia('(prefers-color-scheme: dark)').matches; }
function actualTheme(){ return themeMode==='system' ? (systemDark()?'dark':'light') : themeMode; }
function applyTheme(){ document.documentElement.dataset.theme = actualTheme(); }
applyTheme();
try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{ if(themeMode==='system') applyTheme(); }); }catch(e){}

/* ---- toasts ---- */
function toast(msg,type){
  type=type||'info';
  const el=document.createElement('div');
  el.className='toast '+type;
  el.innerHTML='<span class="tdot"></span>'+msg;
  $('#toastBox').appendChild(el);
  requestAnimationFrame(()=>el.classList.add('in'));
  setTimeout(()=>{ el.classList.remove('in'); setTimeout(()=>el.remove(),400); },2600);
}

/* ---- avatars (локальная копия) ---- */
const GRADS=[['#d9ab3f','#8a611a'],['#8fa8c8','#4d6a94'],['#cf93a4','#8d5568'],['#9dbd95','#587f52'],['#b3a0d6','#6f5a99'],['#d3a58b','#8f5c42']];
function initials(n){ return (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function avatarHTML(u,size,withHat){
  if(withHat===undefined) withHat=true;
  if(!u) return '';
  const g=GRADS[hash(u.name)%GRADS.length];
  const img=u.photo?'<img class="av-p" src="'+u.photo+'" alt="" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">':'';
  const face='<span class="av" style="width:'+size+'px;height:'+size+'px;font-size:'+size+'px;background:linear-gradient(135deg,'+g[0]+','+g[1]+')"><span class="av-i">'+initials(u.name)+'</span>'+img+'</span>';
  if(withHat && u.hat){
    return '<span class="av-wrap" style="width:'+size+'px">'+face+'</span>';
  }
  return face;
}
function mavHTML(w){
  if(!w) return '';
  const u = (w.userId!=null && getUser(w.userId)) || {id:String(w.userId||w.id||''), name:w.name||'?', photo:null, hat:null};
  return avatarHTML(u,18,false);
}

/* ---- РЕНДЕР ---- */
function renderAll(){ renderCalendar(); renderMyDays(); renderUpcoming(); }

function renderCalendar(){
  const y=state.calY, m=state.calM;
  $('#calLabel').textContent=MONTHS[m]+' '+y;
  const first=new Date(y,m,1), startIdx=(first.getDay()+6)%7;
  const dim=new Date(y,m+1,0).getDate(), dimPrev=new Date(y,m,0).getDate();
  const todayK=iso(new Date());
  let html='';
  for(let i=startIdx-1;i>=0;i--) html+='<div class="cal-cell out"><span class="n">'+(dimPrev-i)+'</span></div>';
  for(let d=1;d<=dim;d++){
    const key=iso(new Date(y,m,d)), signs=signupsFor(key);
    const occ=Math.min(signs.length, store.maxSpots);
    const cls=['cal-cell', 's'+occ, key===todayK?'today':''].join(' ');
    html+='<div class="'+cls+'" data-date="'+key+'"><span class="n">'+d+'</span><span class="mavs">'+signs.slice(0,2).map(mavHTML).join('')+'</span></div>';
  }
  const total=startIdx+dim, trail=(7-total%7)%7;
  for(let d=1;d<=trail;d++) html+='<div class="cal-cell out"><span class="n">'+d+'</span></div>';
  $('#calGrid').innerHTML=html;
}

function renderMyDays(){
  const todayK=iso(new Date());
  const mine=store.weekends.filter(w=>String(w.userId)===String(store.userId) && w.date>=todayK).sort((a,b)=>a.date<b.date?-1:1);
  $('#myDays').innerHTML = mine.length ? mine.map(w=>{ const d=fromIso(w.date); return '<button class="chip-day" data-date="'+w.date+'">🌤 '+d.getDate()+' '+MONTHS_MIN[d.getMonth()]+'</button>'; }).join('') : '<span class="empty" style="padding:6px 0">Пока нет записей — выберите дату в календаре.</span>';
}

function renderUpcoming(){
  const todayK=iso(new Date());
  const map={};
  store.weekends.filter(w=>w.date>=todayK).forEach(w=>{ (map[w.date]=map[w.date]||[]).push(w.userId); });
  const dates=Object.keys(map).sort();
  if(!dates.length){ $('#upList').innerHTML='<div class="empty glass"><span class="big">🌤</span>Пока никто не записался.<br>Будьте первым!</div>'; return; }
  $('#upList').innerHTML=dates.slice(0,5).map(k=>{
    const d=fromIso(k), us=map[k].map(getUser).filter(Boolean);
    return '<div class="up-row glass" data-date="'+k+'">'+
      '<div class="up-date"><b>'+d.getDate()+'</b><span>'+MONTHS_MIN[d.getMonth()]+'</span></div>'+
      '<div class="up-mid"><span class="avstack">'+us.map(u=>avatarHTML(u,30,false)).join('')+'</span><span class="up-names">'+us.map(u=>escapeHTML(u.name)).join(', ')+'</span></div>'+
      '<span class="seat-chip'+(us.length>=store.maxSpots?' full':'')+'">'+us.length+'/'+store.maxSpots+'</span></div>';
  }).join('');
}

/* ---- DAY SHEET ---- */
function openDay(key){ state.selDate=key; renderDaySheet(); $('#daySheet').classList.add('on'); $('#dayBd').classList.add('on'); document.body.style.overflow='hidden'; haptic('light'); }
function closeDay(){ $('#daySheet').classList.remove('on'); $('#dayBd').classList.remove('on'); document.body.style.overflow=''; }
function renderDaySheet(){
  const key=state.selDate, d=fromIso(key), signs=signupsFor(key);
  const todayK=iso(new Date()), past=key<todayK;
  $('#dayTitle').textContent=cap(WD_FULL[d.getDay()])+', '+d.getDate()+' '+MONTHS_GEN[d.getMonth()];
  $('#daySub').textContent=past?'Дата прошла':(key===todayK?'Сегодня':'Выходной день')+ ' · занято '+signs.length+' из '+store.maxSpots+' мест';
  let seats='';
  for(let i=0;i<store.maxSpots;i++){
    const u=signs[i]?getUser(signs[i].userId):null;
    seats += u ? '<div class="seat taken">'+avatarHTML(u,34,false)+'<span>'+escapeHTML(u.name)+(String(u.id)===String(store.userId)?' (вы)':'')+'</span></div>'
               : '<div class="seat">○ свободно</div>';
  }
  $('#daySeats').innerHTML=seats;
  const iam=signs.some(w=>String(w.userId)===String(store.userId));
  $('#dayNote').textContent = past ? 'Запись на прошедшую дату недоступна.' : (signs.length>=store.maxSpots && !iam ? 'Мест нет (макс. '+store.maxSpots+').' : '');
  let act='';
  if(!past){
    if(iam) act='<button class="btn btn-danger" data-act="cancel">Отменить запись</button>';
    else if(signs.length>=store.maxSpots) act='<button class="btn btn-ghost" disabled>Мест нет (макс. '+store.maxSpots+')</button>';
    else act='<button class="btn btn-gold" data-act="sign">Записаться</button>';
  }
  act+='<button class="btn btn-ghost" data-act="close">Закрыть</button>';
  $('#dayActions').innerHTML=act;
}

/* ---- Действия → отправляем родителю через postMessage ---- */
function sendToParent(payload){
  try{ window.parent.postMessage(payload,'*'); }catch(e){ console.warn('postMessage to parent failed',e); }
}

$('#dayActions').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act, key=state.selDate;
  if(act==='close'){ closeDay(); return; }
  if(act==='sign'){
    if(signupsFor(key).length>=store.maxSpots){ toast('Мест нет (макс. '+store.maxSpots+')','err'); haptic('error'); return; }
    haptic('light');
    sendToParent({ type:'petzker-cal-action', action:'sign', date:key });
    // Закрываем sheet — родитель пришлёт обновлённые данные и результат
    closeDay();
    return;
  }
  if(act==='cancel'){
    const row=signupsFor(key).find(w=>String(w.userId)===String(store.userId));
    if(!row) return;
    haptic('light');
    sendToParent({ type:'petzker-cal-action', action:'cancel', id:row.id, date:key });
    closeDay();
    return;
  }
});

/* ---- Навигация по месяцу ---- */
$('#calPrev').addEventListener('click',()=>{ state.calM--; if(state.calM<0){state.calM=11;state.calY--;} renderCalendar(); haptic('light'); });
$('#calNext').addEventListener('click',()=>{ state.calM++; if(state.calM>11){state.calM=0;state.calY++;} renderCalendar(); haptic('light'); });
$('#calToday').addEventListener('click',()=>{ const t=new Date(); state.calY=t.getFullYear(); state.calM=t.getMonth(); renderCalendar(); });
$('#calSoon').addEventListener('click',()=>{
  const todayK=iso(new Date());
  const next=Object.keys(store.weekends.filter(w=>w.date>=todayK).reduce((m,w)=>((m[w.date]=1),m),{})).sort()[0];
  if(!next){ toast('Пока никто не записан на выходные','info'); return; }
  const d=fromIso(next); state.calY=d.getFullYear(); state.calM=d.getMonth(); renderCalendar();
  const cell=$('#calGrid').querySelector('[data-date="'+next+'"]');
  if(cell){ cell.classList.add('flash'); setTimeout(()=>cell.classList.remove('flash'),1500); }
  haptic('light');
});
$('#calGrid').addEventListener('click',e=>{ const c=e.target.closest('.cal-cell[data-date]'); if(c) openDay(c.dataset.date); });
$('#upList').addEventListener('click',e=>{ const r=e.target.closest('[data-date]'); if(r) openDay(r.dataset.date); });
$('#myDays').addEventListener('click',e=>{ const c=e.target.closest('[data-date]'); if(c) openDay(c.dataset.date); });
$('#dayBd').addEventListener('click',closeDay);
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ closeDay(); } });

/* ---- Приём сообщений от родителя ---- */
window.addEventListener('message',e=>{
  const d=e&&e.data; if(!d) return;
  // Полные данные календаря
  if(d.type==='petzker-cal-data'){
    store.weekends = d.weekends || [];
    store.users    = d.users    || [];
    store.userId   = d.userId   || store.userId;
    store.maxSpots = d.maxSpots || store.maxSpots;
    if(d.theme){ themeMode = d.theme; applyTheme(); }
    renderAll();
    return;
  }
  // Смена темы
  if(d.type==='petzker-cal-theme'){
    themeMode = d.theme; applyTheme();
    return;
  }
  // Результат действия (sign / cancel)
  if(d.type==='petzker-cal-action-result'){
    if(d.ok){
      haptic('success');
      toast(d.message || 'Готово','ok');
    } else {
      haptic('error');
      toast(d.message || 'Ошибка','err');
    }
    return;
  }
});

/* ---- skeleton на старте, пока данные не пришли ---- */
$('#calGrid').innerHTML=Array(35).fill('<div class="sk" style="height:52px;border-radius:14px"></div>').join('');
$('#upList').innerHTML='<div class="sk" style="height:64px;border-radius:20px"></div>'.repeat(2);

/* ---- Сообщаем родителю, что iframe готов ---- */
sendToParent({ type:'petzker-cal-ready' });
</script>
</body>
</html>
